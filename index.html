<!DOCTYPE html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>사심가득가득</title>
<style>
  :root{
    --xp-blue-1:#1352c8; --xp-blue-2:#2c70e0; --xp-blue-3:#3c84f0; --xp-blue-4:#1a5cd0; --xp-blue-5:#0e3eaa;
    --win-bg:#ece9d8; --win-border:#0058a0;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; min-height:100vh; color:#1a1a1a;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:#0a246a url('assets/bliss.png') center/cover no-repeat fixed;
    display:flex; flex-direction:column; align-items:center;
    padding:32px 16px calc(42px + 32px);
    position:relative; overflow-x:hidden;
  }

  @keyframes bob{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .heart{
    position:fixed; pointer-events:none; font-size:38px; line-height:1; user-select:none;
    animation:bob 3s ease-in-out infinite; filter:drop-shadow(1px 3px 4px rgba(0,0,0,.35)); z-index:1;
  }
  /* Mobile: the window goes fullscreen and would otherwise cover the hearts entirely,
     so float them above it instead of hiding them, and shrink them a bit to fit. */
  @media (max-width:720px){ .heart{z-index:3; font-size:26px;} }

  /* Easter egg: a tiny hidden credit, same floating style as the hearts but clickable. */
  .egg{
    position:fixed; font-size:32px; line-height:1; user-select:none; cursor:pointer;
    background:none; border:none; padding:0; -webkit-tap-highlight-color:transparent;
    animation:bob 3s ease-in-out infinite; filter:drop-shadow(1px 3px 4px rgba(0,0,0,.35)); z-index:2;
  }
  .egg-credit{
    position:fixed; font-family:Tahoma,'Noto Sans KR',sans-serif; font-size:12px; color:#fff;
    background:rgba(10,30,90,.9); padding:5px 10px; border-radius:4px; white-space:nowrap;
    opacity:0; transform:translateY(4px); pointer-events:none; z-index:4;
    box-shadow:0 2px 8px rgba(0,0,0,.35); transition:opacity .25s ease, transform .25s ease;
  }
  .egg-credit.show{opacity:1; transform:translateY(0);}
  @media (max-width:720px){ .egg{z-index:5; font-size:24px;} .egg-credit{z-index:6;} }

  .window{
    position:relative; z-index:2; width:100%; max-width:620px;
    border-radius:8px 8px 4px 4px; overflow:hidden;
    box-shadow:4px 4px 20px rgba(0,0,0,.65), 0 0 0 1px rgba(60,120,240,.4);
  }
  .titlebar{
    height:30px; display:flex; align-items:center; gap:6px; padding:0 4px 0 8px; user-select:none;
    background:linear-gradient(180deg, var(--xp-blue-1) 0%, var(--xp-blue-2) 28%, var(--xp-blue-3) 48%, var(--xp-blue-4) 68%, var(--xp-blue-5) 100%);
  }
  .titlebar span{
    color:#fff; font-family:'Courier New',Tahoma,monospace; font-size:13px; font-weight:bold; flex:1;
    letter-spacing:.06em; text-shadow:1px 1px 3px rgba(0,0,0,.55);
  }
  .titlebar .btns{display:flex; gap:3px;}
  .titlebar button{width:22px; height:21px; border-radius:3px; padding:0; cursor:default; line-height:1; font-family:Tahoma,sans-serif; color:#fff;}
  .titlebar .min, .titlebar .max{border:1px solid #1050aa; background:linear-gradient(180deg,#68b8fc 0%,#3c8ef0 50%,#1e6ee0 100%); font-size:12px; font-weight:bold;}
  .titlebar .close{border:1px solid #8a1010; background:linear-gradient(180deg,#f87070 0%,#e83838 50%,#c01818 100%); font-size:13px; font-weight:bold;}

  .menubar{
    height:22px; background:var(--win-bg); border-bottom:1px solid #aca89c;
    display:flex; align-items:center; padding:0 4px; gap:2px;
  }
  .menubar span{padding:2px 8px; font-family:Tahoma,sans-serif; font-size:12px; color:#1a1a1a;}

  .content{background:#fff; padding:36px 32px 28px; text-align:center;}
  .content h1{font-family:'Courier New',Tahoma,monospace; font-size:38px; font-weight:900; color:#1a1a28; margin:0 0 8px; letter-spacing:.03em;}
  .tagline{font-family:Tahoma,'Noto Sans KR',sans-serif; font-size:12px; color:#aaa; margin:0 0 8px; letter-spacing:.04em;}
  .desc{font-family:'Noto Sans KR',Tahoma,sans-serif; font-size:15px; color:#555; margin:0 0 28px; line-height:1.7;}

  .field{
    width:140px; padding:8px 10px; font-family:Ta
    homa,'Noto Sans KR',sans-serif; font-size:13px;
    border:1px solid #7f9db9; border-radius:2px; background:#fff; color:#1a1a1a;
    box-shadow:inset 1px 1px 2px rgba(0,0,0,.15);
  }
  .xp-btn{
    padding:8px 40px; font-family:Tahoma,'Noto Sans KR',sans-serif; font-size:14px; color:#1a1a1a;
    background:linear-gradient(180deg,#f4f1e8 0%,#d8d4c8 100%);
    border:2px solid var(--win-border); border-radius:3px; cursor:pointer; letter-spacing:.02em;
    box-shadow:inset 1px 1px 0 rgba(255,255,255,.9), inset -1px -1px 0 rgba(0,0,0,.12), 2px 3px 6px rgba(0,0,0,.22);
    display:inline-block;
  }
  .xp-btn:hover{background:linear-gradient(180deg,#dce8fc 0%,#b8cef4 100%); border-color:#0050c0;}
  .xp-btn:active{box-shadow:inset 1px 1px 3px rgba(0,0,0,.2); transform:translateY(1px);}

  .controls{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:12px; margin-bottom:6px;}
  .status{color:#888; font-size:12px; margin:10px 0 0; font-family:Tahoma,'Noto Sans KR',sans-serif;}

  .stage{position:relative; width:100%; margin:20px auto 0; border-radius:6px; overflow:hidden; background:#000;}
  .stage[hidden]{display:none;}
  /* Not display:none: iOS Safari stops decoding <video> frames when it's display:none
     or visibility:hidden, which silently breaks MediaPipe's Camera frame loop (the
     camera *stream* starts fine, but no frames ever reach Pose, so nothing renders). */
  .stage video{position:absolute; width:1px; height:1px; opacity:0; pointer-events:none;}
  /* height:auto lets the canvas keep whatever aspect ratio the camera stream actually
     negotiates (varies by device/orientation) instead of being stretched into a fixed box */
  .stage canvas{width:100%; height:auto; display:block;}

  .taskbar{
    position:fixed; left:0; right:0; bottom:0; height:42px; z-index:10;
    background:linear-gradient(180deg,#1e4ea8 0%,#0e2e80 45%,#0a246a 100%);
    border-top:2px solid #3a7adc; display:flex; align-items:center; padding:0 5px; gap:4px;
  }
  .start-btn{
    height:36px; padding:0 14px 0 6px; display:flex; align-items:center; gap:6px;
    background:linear-gradient(180deg,#60cc50 0%,#30a828 30%,#229020 65%,#44be34 100%);
    border:1px solid #187010; border-radius:0 18px 18px 0; color:#fff;
    font-family:Tahoma,sans-serif; font-size:13px; font-weight:bold; cursor:default;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.28), 2px 1px 5px rgba(0,0,0,.45);
  }
  .taskbar .sep{width:1px; height:32px; background:rgba(255,255,255,.14); margin:0 3px;}
  .task-chip{
    height:30px; padding:0 12px; min-width:120px; background:linear-gradient(180deg,#2c5ad4 0%,#1a3ea4 100%);
    border:1px solid #0a2880; border-top:1px solid #4a80f0; color:#fff; font-family:Tahoma,sans-serif; font-size:11px;
    border-radius:2px; display:flex; align-items:center; gap:6px; cursor:default;
  }
  .tray{
    height:32px; padding:0 10px; display:flex; align-items:center; gap:9px; margin-left:auto;
    background:rgba(8,28,96,.7); border:1px solid rgba(60,120,220,.4);
    font-family:Tahoma,sans-serif; font-size:12px; color:#fff; border-radius:1px;
  }
  #clock{font-size:11px; color:#d8eaff;}

  /* Mobile: the window goes fullscreen (like a maximized XP window) instead of floating
     as a small card over the wallpaper, and the taskbar chrome shrinks to fit. */
  @media (max-width:700px){
    html,body{height:100%; overflow:hidden;}
    body{padding:55px 20px calc(42px + 120px); align-items:stretch;}
    .window{
      width:100%; max-width:none; min-height:calc(100vh - 42px - 210px);
      border-radius:8px 8px 4px 4px;
      box-shadow:4px 4px 20px rgba(0,0,0,.65), 0 0 0 1px rgba(60,120,240,.4);
      display:flex; flex-direction:column;
    }
    .content{flex:1; display:flex; flex-direction:column; justify-content:center; padding:28px 18px 22px;}
    .content h1{font-size:30px;}
    .xp-btn{padding:8px 26px;}

    .titlebar button{width:20px; height:19px;}
    .start-btn{padding:0 10px 0 5px; font-size:12px; gap:4px;}
    .start-btn span{font-size:17px !important;}
    .task-chip{min-width:0; padding:0 8px; font-size:10px;}
    .tray{padding:0 7px; gap:6px;}
  }
</style>

<div class="heart" style="top:20vh; left:10vw; animation-delay:.2s;">💖</div>
<div class="heart" style="top:14vh; right:8vw; animation-delay:1s;">🍀</div>
<div class="heart" style="bottom:24vh; left:9vw; animation-delay:.6s;">🧚</div>
<div class="heart" style="bottom:26vh; right:11vw; animation-delay:1.4s;">🥽</div>
<button type="button" class="egg" id="eggBtn" style="top:13vh; left:20vw; animation-delay:.4s;" aria-label="secret">🐯</button>
<span class="egg-credit" id="eggCredit" style="top:calc(5vh + 38px); left:5vw;">made by maeng-kim</span>

<div class="window">
  <div class="titlebar">
    <span>KKOOMSSOK</span>
    <div class="btns">
      <button class="min">─</button>
      <button class="max">□</button>
      <button class="close">✕</button>
    </div>
  </div>
  <div class="menubar">
    <span>파일(F)</span>
    <span>도움말(H)</span>
  </div>

  <div class="content">
    <h1>KKOOMSSOK</h1>
    <p class="tagline">내사심가득채워만들엇다</p>
    <p class="desc">왜요나도안겨보고싶엇다구요</p>

    <div class="controls">
      <label class="xp-btn" for="fileInput">이미지 선택</label>
      <input type="file" id="fileInput" accept="image/*" hidden>
      <input type="text" id="nameInput" class="field" maxlength="2" placeholder="이름 2글자">
    </div>
    <p class="status" id="pickStatus"></p>

    <div class="stage" id="stage" hidden>
      <video id="video" playsinline autoplay muted></video>
      <canvas id="output"></canvas>
    </div>
    <p class="status" id="status"></p>
  </div>
</div>

<div class="taskbar">
  <button class="start-btn"><span style="font-size:20px;line-height:1;">🪟</span>시작</button>
  <div class="sep"></div>
  <div class="task-chip"><span style="font-family:'Courier New',monospace; letter-spacing:.04em;">KKOOMSSOK</span></div>
  <div class="tray">
    <span>🔊</span><span>🌐</span><span id="clock"></span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

<script type="module" src="src/main.js"></script>

<script>
  (function () {
    var btn = document.getElementById('eggBtn');
    var credit = document.getElementById('eggCredit');
    var hideTimer;
    btn.addEventListener('click', function () {
      credit.classList.add('show');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(function () { credit.classList.remove('show'); }, 2500);
    });
  })();
</script>
