<title>사심가득가득</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#111318; --panel:#1b1e27; --accent:#ff8a5c; --text:#f2f2f5; --muted:#9aa0ac;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    padding:10px 16px 10px;
  }
  .app{max-width:640px;margin:0 auto;}
  h1{font-size:22px;margin:0 0 4px;}
  h1 + p{color:var(--muted);margin-top:0;font-size:14px;}
  .panel{
    background:var(--panel); border-radius:16px; padding:18px;
    margin-bottom:18px; border:1px solid #2a2e3a;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  .picker{
    background:var(--accent); color:#1b1200; border:none; border-radius:10px;
    padding:10px 16px; font-size:14px; font-weight:600; cursor:pointer; display:inline-block;
  }
  .stage{
    position:relative; width:100%; max-width:640px; margin:0 auto;
    border-radius:14px; overflow:hidden; background:#000; aspect-ratio:4/3;
  }
  .stage[hidden]{display:none;}
  .stage video{display:none;}
  .stage canvas{width:100%; height:100%; display:block;}
  .status{color:var(--muted); font-size:13px; margin:0;}
</style>

<div class="app">
  <h1>내사심가득채워만들엇다.</h1>
  <p>왜요나도안겨보고싶엇다구요.</p>

  <div class="panel">
    <label class="picker" for="fileInput">이미지 선택</label>
    <input type="file" id="fileInput" accept="image/*" hidden>
    <input type="text" id="nameInput" maxlength="2" placeholder="이름 2글자" style="width:90px;padding:10px 12px;border-radius:10px;border:1px solid #2a2e3a;background:#12141b;color:var(--text);font-size:14px;">
    <p class="status" id="pickStatus"></p>
  </div>

  <div class="stage" id="stage" hidden>
    <video id="video" playsinline autoplay muted></video>
    <canvas id="output"></canvas>
  </div>
  <p class="status" id="status"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

<script type="module" src="src/main.js"></script>
